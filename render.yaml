services:
  - type: web
    name: smart-delivery-prediction
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: DELIVERY_DB_PATH
        value: /tmp/delivery.db
      - key: BOOTSTRAP_ON_START
        value: "0"
      - key: FLASK_DEBUG
        value: "0"
      # PORT is set automatically by Render at runtime
