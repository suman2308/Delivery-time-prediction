{% extends "base.html" %}
{% block title %}Admin Login — CourierAI{% endblock %}
{% block content %}

<section class="auth-wrap">
  <div class="auth-card reveal">
    <div class="auth-logo">
      <span class="brand-mark" aria-hidden="true" style="width:52px;height:52px;border-radius:var(--radius);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </span>
    </div>
    <h1 class="auth-title">Admin Panel</h1>
    <p class="auth-sub">Restricted area — sign in with admin credentials to manage the platform.</p>

    <form method="post" action="{{ url_for('admin_login') }}" data-validate novalidate>
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="field-label" for="adminEmail">Admin email</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input id="adminEmail" name="email" type="email" class="input" placeholder="admin@example.com" autocomplete="username" required>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="adminPassword">Password</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="adminPassword" name="password" type="password" class="input" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Enter admin panel</button>
    </form>

    <div class="alert alert-info mt-4" role="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>Admin access is restricted to authorised operators.</span>
    </div>

    <p class="auth-foot"><a href="{{ url_for('index') }}">&larr; Back to home</a></p>
  </div>
</section>

{% endblock %}
