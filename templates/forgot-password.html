{% extends "base.html" %}
{% block title %}Reset Password — CourierAI{% endblock %}
{% block content %}

<section class="auth-wrap">
  <div class="auth-card reveal">
    <div class="auth-logo">
      <span class="brand-mark" aria-hidden="true" style="width:52px;height:52px;border-radius:var(--radius);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
    </div>
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter your account email and we'll send you a secure reset link.</p>

    <form data-demo data-validate novalidate>
      <div class="field">
        <label class="field-label" for="resetEmail">Email</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input id="resetEmail" type="email" class="input" placeholder="you@company.com" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Send reset link</button>
    </form>

    <p class="auth-foot">Remembered it? <a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</section>

{% endblock %}
