<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Delivery Engine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-time="day" data-weather="clear">


  <div class="page-wrap">
    <header>
      <div class="brand">
        <span class="logo-dot"></span>
        <div>
          <div class="brand-title">Smart Delivery Engine</div>
        </div>
        <span class="pill">v2.0 ML Platform</span>
      </div>
      <div class="controls">
        <button class="icon-btn" id="themeToggle" type="button" title="Toggle Light/Dark Theme">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Navigation">
        <h3>Menu</h3>
        <div class="side-links" id="sideNav">
          <a href="{{ url_for('index') }}"><span>Predictor</span><small>Live Form</small></a>
          <a href="{{ url_for('dashboard') }}"><span>Analytics</span><small>Charts</small></a>
          <a href="{{ url_for('admin') }}"><span>Database</span><small>Explorer</small></a>
          <a href="{{ url_for('metrics_json') }}" target="_blank"><span>API Metrics</span><small>JSON</small></a>
        </div>
        <div style="margin-top:1.5rem;">
          <span class="tag ok" style="font-size:0.75rem; width:100%; justify-content:center;">System Operational</span>
        </div>
      </aside>

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>

    <div class="footer-note">Smart Delivery Prediction Platform &copy; 2026</div>
  </div>

  <script src="{{ url_for('static', filename='js/scene.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
