name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model artifact loads correctly
        run: |
          python -c "import joblib; joblib.load('models/dtdc_hgb_v1_0_0.joblib'); print('Model artifact loads OK')"

      - name: Run tests with pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify application imports
        run: |
          python -c "import app; print('Application imports OK')"
